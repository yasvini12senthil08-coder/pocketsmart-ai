{% extends "base.html" %}
{% block content %}
<h2>AI-Based Party Budget Planner</h2>
<form action="/generate-party" method="POST">
    <label>Total Budget (₹):</label>
    <input type="number" step="0.01" name="budget" required placeholder="e.g. 20000">

    <label>Guest Count:</label>
    <input type="number" name="guests" required placeholder="e.g. 25">

    <label>Event Type:</label>
    <input type="text" name="party_type" required placeholder="Birthday, Anniversary, Corporate">

    <label>Venue Details & Preferences:</label>
    <textarea name="items_description" rows="4" required placeholder="Indoor or outdoor, catering style..."></textarea>

    <button type="submit">Generate Party Plan</button>
</form>
{% endblock %}
